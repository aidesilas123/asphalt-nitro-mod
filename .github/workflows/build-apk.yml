name: Build Asphalt Nitro Mod APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Download Build Tools (Apktool & Uber-APK-Signer)
        run: |
          mkdir -p tools build/signed
          echo "Downloading Apktool v2.9.3..."
          curl -sL https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -o tools/apktool.jar
          echo "Downloading Uber-APK-Signer v1.3.0..."
          curl -sL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o tools/uber-apk-signer.jar

      - name: Prepare Project Structure for Apktool
        run: |
          mkdir -p build
          # If exported from JADX, resources/ holds AndroidManifest.xml, res, assets, lib
          if [ -d "resources" ]; then
            echo "Moving resources directory structure for Apktool..."
            [ -f "resources/AndroidManifest.xml" ] && mv -f resources/AndroidManifest.xml ./AndroidManifest.xml
            [ -d "resources/res" ] && mv -f resources/res ./res
            [ -d "resources/assets" ] && mv -f resources/assets ./assets
            [ -d "resources/lib" ] && mv -f resources/lib ./lib
            rm -rf resources
          fi
          # Remove sources folder so Apktool does not package 25,000 java files into APK
          rm -rf sources

      - name: Split Combined Smali Classes
        run: |
          if [ -f "tools/split_smali.py" ]; then
            echo "Checking multi-class smali files..."
            python3 tools/split_smali.py smali
          fi

      - name: Build APK with Apktool
        run: |
          echo "Compiling APK..."
          java -jar tools/apktool.jar b . -o build/AsphaltNitro-unsigned.apk --use-aapt2 2>&1 | tee build/apktool.log
          if [ ! -f "build/AsphaltNitro-unsigned.apk" ]; then
            echo "=== APKTOOL BUILD LOG (LAST 100 LINES) ==="
            tail -n 100 build/apktool.log
            exit 1
          fi

      - name: Sign APK
        if: success()
        run: |
          echo "Signing APK with test key..."
          java -jar tools/uber-apk-signer.jar --apks build/AsphaltNitro-unsigned.apk --out build/signed --allowResign

      - name: Upload Signed APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AsphaltNitro-Mod-v1.8.0a
          path: build/signed/*.apk
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/apktool.log
          if-no-files-found: ignore
